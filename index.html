.abs{position:absolute}

/* Cabeçalho */
#titulo{left:476px;top:120px}
#titulo h1{margin:0;font-size:34px;font-weight:700;font-variation-settings:"wdth" 118;line-height:1.05;letter-spacing:.01em}
#titulo p{margin:4px 0 0;font-size:17px;color:var(--suave);display:flex;gap:14px;align-items:center}
#btnCsv{all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--lima);border:1px solid rgba(182,222,1,.45);border-radius:999px;padding:1px 12px}
#btnCsv[hidden]{display:none}
#btnCsv:hover{background:rgba(242,252,0,.12)}
#filtros{right:120px;top:128px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.grupo{display:flex;gap:10px;align-items:center}
.seg{display:flex;background:var(--painel-forte);border:1px solid rgba(182,222,1,.45);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 16px;border-radius:999px;font-size:16px;font-weight:600;color:var(--suave)}
.seg button[aria-pressed="true"]{background:var(--lima);color:#0B3A12}
.seg button:not([aria-pressed="true"]):hover{color:var(--texto)}
.nav{display:flex;align-items:center;background:var(--painel-forte);border:1px solid rgba(182,222,1,.45);border-radius:999px}
.nav button{all:unset;cursor:pointer;width:38px;height:36px;display:grid;place-items:center;font-size:20px;color:var(--lima)}
.nav button:disabled{color:var(--apagado);cursor:default}
button:focus-visible,select:focus-visible{outline:3px solid var(--lima);outline-offset:2px}
/* Filtro de tipo de produto */
.sel-wrap{position:relative;display:flex;align-items:center;background:var(--painel-forte);border:1px solid rgba(182,222,1,.45);border-radius:999px;padding:0 4px 0 16px;height:40px}
.sel-wrap label{font-size:14px;color:var(--suave);margin-right:8px}
.sel-wrap select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--texto);font:600 16px "Saira",system-ui,sans-serif;
  padding:6px 34px 6px 4px;cursor:pointer;min-width:170px}
.sel-wrap select option{background:#05301B;color:var(--texto)}
.sel-wrap::after{content:"";position:absolute;right:16px;top:50%;border:5px solid transparent;border-top-color:var(--lima);transform:translateY(-2px);pointer-events:none}
.sel-wrap.ativo{border-color:var(--lima);box-shadow:0 0 0 1px var(--lima) inset}

/* Indicadores */
#kpis{left:120px;top:214px;width:1680px;height:142px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.kpi{background:var(--painel);border:1px solid rgba(182,222,1,.35);border-radius:14px;padding:16px 20px;
  display:flex;flex-direction:column;justify-content:space-between;backdrop-filter:blur(2px)}
.kpi h3{margin:0;font-size:17px;font-weight:500;color:var(--suave)}
.kpi .v{font-size:44px;font-weight:700;font-variation-settings:"wdth" 88;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:22px;font-weight:600;margin-left:4px;color:var(--suave)}
.kpi .d{font-size:15px;color:var(--suave)}
.kpi .d b{font-weight:700}
.sobe{color:var(--sobe)} .desce{color:var(--desce)}
.kpi.destaque{background:var(--pouch);border-color:var(--pouch);color:#3A2A00}
.kpi.destaque h3,.kpi.destaque .d,.kpi.destaque .v small{color:#6B4E00}
.kpi.destaque .d b{color:#3A2A00}
.kpi .d b.pc{color:var(--cor)} .kpi{--cor:var(--texto)}
.kpi h3 i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--cor);margin-right:7px}
.kpi.cobertura{padding:12px 18px;justify-content:flex-start;gap:7px}
.kpi.cobertura h3{display:flex;justify-content:space-between;margin-bottom:2px}
.kpi.cobertura h3 span{font-size:13px}
.cb{display:grid;grid-template-columns:72px 1fr 46px 46px;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.cb .n{font-size:14px;font-weight:600;color:var(--cor)}
.cb .tr{height:8px;border-radius:4px;background:rgba(234,246,228,.08);overflow:hidden}
.cb .tr i{display:block;height:100%;background:var(--cor);border-radius:4px;transition:width .6s ease}
.cb b{font-size:17px;text-align:right}
.cb .q{font-size:12px;color:var(--suave);text-align:right}
.medidor{height:8px;border-radius:4px;background:rgba(11,58,18,.2);overflow:hidden}
.medidor i{display:block;height:100%;background:#3A2A00;border-radius:4px;transition:width .7s ease}

/* Painéis */
.painel{overflow:hidden;background:var(--painel);border-top:2px solid var(--linha);border-radius:0 0 14px 14px;padding:18px 24px}
.painel h2{margin:0;font-size:21px;font-weight:600;font-variation-settings:"wdth" 110}
.painel .nota{font-size:14px;color:var(--suave);margin:2px 0 0}
#evolucao{left:120px;top:378px;width:1060px;height:262px}
#clientes{left:120px;top:378px;width:1060px;height:262px}
.rolagem{position:absolute;left:24px;right:14px;top:56px;bottom:12px;overflow-y:auto;padding-right:10px;
  scrollbar-width:thin;scrollbar-color:rgba(182,222,1,.5) transparent}
.rolagem::-webkit-scrollbar{width:8px}.rolagem::-webkit-scrollbar-thumb{background:rgba(182,222,1,.45);border-radius:4px}
.rolagem table{margin-top:0}
.rolagem thead th{position:sticky;top:0;background:#032817;z-index:1;padding-top:4px}
td.id{font-size:13px;color:var(--suave)}
th.ord{padding:0}
th.ord button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;text-align:right;padding:4px 5px 6px;border-radius:6px;white-space:nowrap}
th.ord button:hover{background:rgba(242,252,0,.1)}
th.ord button:focus-visible{outline:2px solid var(--lima);outline-offset:-2px}
th.ord .seta{display:inline-block;width:8px;margin-left:2px;font-size:10px;opacity:.35}
th.ord.ativo button{font-weight:700;text-decoration:underline;text-underline-offset:3px}
th.ord.ativo .seta{opacity:1}
td.uf{font-size:13px;color:var(--suave);text-align:center}
td.vd{font-size:13px;color:var(--suave);max-width:170px;overflow:hidden;text-overflow:ellipsis}
#clientes td.nm{max-width:300px}
td.cob{font-size:13px;color:var(--suave)} td.cob b{color:var(--pouch);font-size:14px} td.cob.zero b{color:var(--apagado);font-weight:400}
#marca{right:124px;top:66px;height:46px;width:auto}
#segmentos{left:120px;top:658px;width:1060px;height:282px;padding:0;
  clip-path:polygon(0 0,100% 0,100% 100%,157px 100%,0 125px)}
#vendedores{left:1200px;top:378px;width:600px;height:562px}
#vendedores td.nm{max-width:136px}

/* Barras */
.grafico{position:absolute;display:flex;align-items:flex-end;gap:6px}
#evolucao .grafico{left:24px;right:24px;bottom:16px;top:74px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.barra{width:100%;max-width:64px;border-radius:4px 4px 0 0;transition:height .6s ease,opacity .3s;min-height:2px;background:var(--cor)}
#evolucao .barra{background:var(--fita)}
/* no modo Dia, a semana aparece e só o dia escolhido fica aceso */
.modo-dia .col:not(.atual) .barra{opacity:.4}
.col .lb{font-size:13px;color:var(--suave);margin-top:6px;height:18px;white-space:nowrap}
.col.atual .lb{color:var(--lima);font-weight:700}
.col .vl{font-size:13px;font-weight:600;margin-bottom:4px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Linhas em foco: comparação na mesma escala */
#segIntro{position:absolute;left:24px;top:18px;width:150px}
#segIntro h2{font-size:21px;line-height:1.15}
#segIntro p{font-size:14px;color:var(--suave);margin:8px 0 0;line-height:1.35}
#foco{position:absolute;left:190px;right:24px;top:16px;bottom:12px;display:flex;flex-direction:column}
#comp{display:flex;flex-direction:column;gap:8px}
.linha{display:grid;grid-template-columns:168px 1fr 200px;align-items:center;gap:14px}
.linha .nome{font-size:16px;font-weight:600;color:var(--cor);white-space:nowrap}
.linha .trilho{height:18px;border-radius:9px;background:rgba(234,246,228,.07);overflow:hidden}
.linha .trilho i{display:block;height:100%;border-radius:9px;background:var(--cor);transition:width .6s ease;min-width:4px}
.linha .val{font-size:22px;font-weight:700;font-variation-settings:"wdth" 88;font-variant-numeric:tabular-nums;white-space:nowrap}
.linha .val small{font-size:14px;color:var(--suave);font-weight:600;margin-left:2px}
.linha .val em{font-style:normal;font-size:14px;font-weight:500;color:var(--suave);margin-left:10px;font-variation-settings:"wdth" 100}
.linha .val em b{color:var(--texto);font-weight:600}
.linha .trilho{position:relative}
.linha .trilho::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed rgba(234,246,228,.18)}
/* modo Dia: só as três barras, grandes */
#foco.so-comp #comp{flex:1;justify-content:space-evenly;gap:0}
#foco.so-comp .linha{grid-template-columns:130px 1fr 290px}
#foco.so-comp .linha .nome{font-size:19px}
#foco.so-comp .linha .trilho{height:34px;border-radius:8px}
#foco.so-comp .linha .trilho i{border-radius:8px}
#foco.so-comp .linha .val{font-size:30px}
#foco.so-comp #tempo{display:none}
/* evolução agrupada (semana / mês / ano), mesma escala para as três */
#tempo{flex:1;display:flex;align-items:flex-end;gap:4px;margin-top:12px;padding-top:6px;border-top:1px solid rgba(182,222,1,.15);min-height:0}
.grp{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.grp .bs{width:100%;max-width:48px;display:flex;align-items:flex-end;justify-content:center;gap:1px;flex:1}
.grp .bs i{flex:1;max-width:14px;background:var(--cor);border-radius:2px 2px 0 0;min-height:1px;transition:height .6s ease}
.grp .lb{font-size:11px;color:var(--suave);height:14px;margin-top:3px;white-space:nowrap}
.grp.atual .lb{color:var(--lima);font-weight:700}
.pouch{--cor:var(--pouch)} .sint{--cor:var(--sint)} .drive{--cor:var(--drive)}

/* Tabela de vendedores */
table{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
th{font-size:13px;font-weight:500;color:var(--suave);text-align:left;padding:0 5px 6px;white-space:nowrap}
td{font-size:15px;padding:4px 5px;height:31px;border-top:1px solid rgba(182,222,1,.15);white-space:nowrap}
td.n{color:var(--suave);width:24px;text-align:right}
td.num,th.num{text-align:right}
td.nm{max-width:170px;overflow:hidden;text-overflow:ellipsis}
td.sub{font-size:13px;color:var(--suave)}
td.tt{font-weight:700}
td.c{font-size:14px}
td.c.zero{color:var(--apagado)}
td.c.pouch{color:var(--pouch);font-weight:600} td.c.sint{color:var(--sint)} td.c.drive{color:var(--drive)}
th.pouch{color:var(--pouch)} th.sint{color:var(--sint)} th.drive{color:var(--drive)}
td.c.zero{color:var(--apagado);font-weight:400}

/* Rodapé no recorte inferior da moldura */
#rodape{left:540px;top:980px;width:480px;text-align:center;font-size:15px;font-weight:600;color:#0B3A12}
#rodape.atrasado{color:#8A1C0A}

/* Arrastar CSV */
#soltar{position:absolute;inset:60px;border:3px dashed var(--lima);border-radius:24px;background:rgba(0,28,16,.88);z-index:20;
  display:grid;place-items:center;text-align:center;font-size:32px;font-weight:700;font-variation-settings:"wdth" 115}
#soltar[hidden]{display:none}
#soltar small{display:block;font-size:18px;font-weight:500;color:var(--suave);margin-top:8px}
#aviso{left:50%;top:60px;transform:translateX(-50%);z-index:30;background:var(--lima);color:#0B3A12;font-weight:600;font-size:17px;
  padding:10px 22px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.4);transition:opacity .4s}
#aviso[hidden]{display:none}

/* Calendário */
#rotulo{all:unset;cursor:pointer;min-width:230px;text-align:center;font-size:17px;font-weight:600;padding:6px 4px;border-radius:8px}
#rotulo:hover{color:var(--lima)}
#rotulo::after{content:"";display:inline-block;margin-left:8px;border:5px solid transparent;border-top-color:currentColor;transform:translateY(3px)}
#cal{right:392px;top:178px;width:372px;z-index:10;background:#05301B;border:1px solid var(--linha);border-radius:14px;padding:14px 14px 12px;
  box-shadow:0 18px 44px rgba(0,0,0,.5)}
#cal[hidden]{display:none}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-top b{font-size:17px;font-weight:600}
.cal-top button{all:unset;cursor:pointer;width:34px;height:32px;display:grid;place-items:center;font-size:20px;color:var(--lima);border-radius:8px}
.cal-top button:disabled{color:var(--apagado);cursor:default}
.cal-dias{width:100%;border-collapse:separate;border-spacing:0 3px;margin:0}
.cal-dias th{font-size:13px;color:var(--suave);text-align:center;padding:0 0 4px;font-weight:500}
.cal-dias td{padding:0;border:0;height:auto;text-align:center}
.cal-dias button,.cal-grade button{all:unset;cursor:pointer;display:block;width:100%;height:36px;line-height:36px;text-align:center;
  font-size:16px;border-radius:8px;font-variant-numeric:tabular-nums}
.cal-dias button.fora{color:var(--apagado)}
.cal-dias button.tem::after{content:"";display:block;width:4px;height:4px;border-radius:2px;background:var(--linha);margin:-8px auto 0}
.cal-dias button:disabled,.cal-grade button:disabled{color:#2F5A3E;cursor:default}
.cal-dias button:not(:disabled):hover,.cal-grade button:not(:disabled):hover{background:rgba(242,252,0,.14)}
.cal-dias button.sel,.cal-grade button.sel{background:var(--lima);color:#0B3A12;font-weight:700}
.cal-dias button.hoje:not(.sel){box-shadow:inset 0 0 0 1px var(--linha)}
.modo-semana tr:hover button:not(:disabled){background:rgba(242,252,0,.14);border-radius:0}
.modo-semana tr button{border-radius:0}
.modo-semana tr td:first-child button{border-radius:8px 0 0 8px}
.modo-semana tr td:last-child button{border-radius:0 8px 8px 0}
.modo-semana tr.sel button{background:var(--lima);color:#0B3A12;font-weight:700}
.modo-semana tr.sel button.fora{color:#2F6A1E}
.cal-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cal-grade button{height:48px;line-height:48px}
.cal-dica{margin:8px 2px 0;font-size:13px;color:var(--suave)}

/* =================== CELULAR / TELA ESTREITA =================== */
#topoM{display:none}
@media (max-width:900px){
  html,body{height:auto}
  html{background:#002A18}
  body{overflow:auto;background:radial-gradient(140% 900px at 15% 0%,#0B5A2A 0%,#003A1F 45%,#002A18 100%) no-repeat #002A18}
  #palco{position:static;width:auto;height:auto;transform:none!important;background:none;
    display:flex;flex-direction:column;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px))}
  .abs{position:static}
  #marca{display:none}
  #topoM{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 0}
  #lubraxM{height:26px} #marcaM{height:30px}
  #titulo h1{font-size:26px}
  #titulo p{font-size:14px}
  /* filtros */
  #filtros{align-items:stretch}
  #filtros .grupo{flex-wrap:wrap;gap:8px}
  #fPeriodo,#fUF{flex:1 1 100%}
  #fPeriodo button,#fUF button{flex:1;text-align:center;padding:8px 6px;font-size:15px}
  .nav{flex:1 1 100%;justify-content:space-between}
  .nav button{width:46px;height:42px}
  #rotulo{min-width:0;flex:1}
  #cal{position:fixed;left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;z-index:40}
  /* KPIs em 2 colunas */
  #kpis{width:auto;height:auto;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px 14px;gap:6px;min-height:112px}
  .kpi h3{font-size:14px}
  .kpi .v{font-size:32px}
  .kpi .v small{font-size:15px}
  .kpi .d{font-size:13px}
  .kpi.cobertura{grid-column:1/-1;min-height:0}
  .cb{grid-template-columns:80px 1fr 46px 52px}
  /* painéis empilhados */
  .painel{width:auto!important;height:auto!important;padding:14px 14px 12px;background:var(--painel-forte)}
  .painel h2{font-size:18px}
  #segmentos{order:3;clip-path:none;padding:14px}
  #vendedores{order:4} #clientes{order:5}
  #segIntro{position:static;width:auto;margin-bottom:10px}
  #segIntro h2{font-size:18px} #segIntro p{margin-top:2px}
  #foco{position:static}
  .linha{grid-template-columns:1fr auto;gap:4px 10px}
  .linha .nome{font-size:15px}
  .linha .trilho{grid-column:1/-1;grid-row:2;height:14px}
  .linha .val{font-size:20px;text-align:right;grid-row:1;grid-column:2}
  .linha .val em{margin-left:6px}
  #comp{gap:12px}
  #foco.so-comp #comp{gap:14px}
  #foco.so-comp .linha .trilho{height:24px}
  #foco.so-comp .linha .val{font-size:24px}
  #tempo{height:150px;flex:none}
  /* tabelas com rolagem */
  .rolagem{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin-top:8px;max-height:420px;overflow:auto;padding-right:4px}
  td{font-size:13px;height:auto;padding:6px 4px}
  th{font-size:11px;padding:4px 4px 6px}
  td.n{width:18px}
  /* nome do vendedor/cliente fica parado ao rolar a tabela para o lado */
  td.nm,th:nth-child(2){position:sticky;left:0;background:#032817;z-index:1}
  .rolagem thead th:nth-child(2){z-index:2}
  #vendedores td.nm{max-width:112px}
  #clientes td.nm{max-width:150px}
  /* no celular, a tabela de clientes esconde UF, vendedor e pedidos para caber */
  #clientes th:nth-child(4),#clientes td:nth-child(4),#clientes th:nth-child(5),#clientes td:nth-child(5),#clientes th:nth-child(6),#clientes td:nth-child(6){display:none}
  #rodape{width:auto;text-align:center;order:6}
  #rodape:empty{display:none}
  #aviso{position:fixed;left:12px;right:12px;transform:none;top:auto;bottom:20px;text-align:center}
}
@media (max-width:900px) and (prefers-color-scheme:light){body{color-scheme:dark}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const palco=document.getElementById("palco");
const CELULAR=matchMedia("(max-width:900px)");
function encaixar(){if(CELULAR.matches){palco.style.transform="";return;}const s=Math.min(innerWidth/1920,innerHeight/1080);palco.style.transform=`translate(-50%,-50%) scale(${s})`;}
CELULAR.addEventListener?.("change",encaixar);
addEventListener("resize",encaixar);encaixar();

const nf=(v,d=0)=>v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});

/* Classifica um produto: 1) código manual  2) de-para novo→antigo  3) código antigo escrito no nome  4) mesmo nome da planilha */
function classificar(cod,texto){
  if(CONFIG.CLASSIF_POR_CODIGO[cod]) return CONFIG.CLASSIF_POR_CODIGO[cod];
  if(PORTFOLIO[DE_PARA[cod]]) return PORTFOLIO[DE_PARA[cod]].slice(1);
  for(const n of (texto.match(/\b\d{7}\b/g)||[])) if(PORTFOLIO[n]) return PORTFOLIO[n].slice(1);
  const base=texto.replace(/\s*-\s*\d{6,}\s*$/,"").replace(/\s*-?\s*\b\d{7}\b\s*/g," ");
  return PF_NOME.get(norm(base))||null;
}

/* ============ Leitura do CSV do uMov ============ */
function lerCSV(txt){
  txt=txt.replace(/^\uFEFF/,"");
  const l1=txt.split(/\r?\n/,1)[0], sep=(l1.match(/;/g)||[]).length>=(l1.match(/,/g)||[]).length?";":",";
  const out=[];let row=[],f="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===sep){row.push(f);f="";}
    else if(c==="\n"){row.push(f);out.push(row);row=[];f="";}
    else if(c!=="\r") f+=c;
  }
  if(f||row.length){row.push(f);out.push(row);}
  return out.filter(r=>r.some(x=>x.trim()!==""));
}
const num=s=>{s=String(s??"").replace(/R\$|\s/g,"");if(!s)return 0;
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)||0;};

/* Linhas guardadas (só VENDAS): [data, vendedor do cliente, id_cliente, pedido, cod_produto, litros] */
function csvParaLinhas(txt,D){
  const rows=lerCSV(txt); if(rows.length<2) throw new Error("arquivo vazio");
  const h=rows[0].map(norm), col=n=>h.indexOf(norm(n));
  const ix={vend:col("Vendedor do cliente"),cli:col("Cliente"),data:col("Data pedido"),ped:col("Nro. pedido"),tipo:col("Tipo pedido"),
    prod:col("Produto"),vol:col("Volume total")};
  const falta=Object.entries(ix).filter(([,v])=>v<0).map(([k])=>k);
  if(falta.length) throw new Error("colunas não encontradas: "+falta.join(", "));
  const linhas=[];
  for(const r of rows.slice(1)){
    if(norm(r[ix.tipo])!=="venda") continue;                       // cotações ficam de fora
    const m=String(r[ix.data]).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(!m) continue;
    const data=`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    const cliTxt=r[ix.cli].trim(), cm=cliTxt.match(/^(.*?)\s*-\s*(\d{11,14})\s*-\s*(\d+)\s*$/);
    const idCli=cm?cm[3].replace(/^0+/,""):cliTxt; if(cm&&!D.clientes[idCli]) D.clientes[idCli]=cm[1];
    const prodTxt=r[ix.prod].trim(), pm=prodTxt.match(/-\s*(\d{6,})\s*$/);
    const cod=pm?pm[1]:prodTxt; D.produtos[cod]=prodTxt;
    linhas.push([data,r[ix.vend].trim(),idCli,String(r[ix.ped]).trim(),cod,num(r[ix.vol])]);
  }
  return linhas;
}
function mesclar(D,novas){
  const dias=new Set(novas.map(l=>l[0]));
  D.linhas=D.linhas.filter(l=>!dias.has(l[0])).concat(novas);
  D.gerado_em=new Date().toISOString();
  return dias;
}

/* ============ Períodos ============ */
function inicioSemana(d){const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x;}
function intervalo(per,ref){
  const a=new Date(ref);
  if(per==="dia")return [a,new Date(a)];
  if(per==="semana"){const s=inicioSemana(a),b=new Date(s);b.setDate(s.getDate()+6);return [s,b];}
  if(per==="mes")return [new Date(a.getFullYear(),a.getMonth(),1),new Date(a.getFullYear(),a.getMonth()+1,0)];
  return [new Date(a.getFullYear(),0,1),new Date(a.getFullYear(),11,31)];
}
function mover(per,ref,n){const d=new Date(ref);
  if(per==="dia")d.setDate(d.getDate()+n);else if(per==="semana")d.setDate(d.getDate()+7*n);
  else if(per==="mes"){d.setDate(1);d.setMonth(d.getMonth()+n);}else{d.setMonth(0,1);d.setFullYear(d.getFullYear()+n);}
  return d>HOJE?new Date(HOJE):d;}
function rotulo(per,ref){const [a,b]=intervalo(per,ref);
  if(per==="dia")return `${SEM[a.getDay()]}, ${a.getDate()} ${MES[a.getMonth()]} ${a.getFullYear()}`;
  if(per==="semana")return a.getMonth()===b.getMonth()?`${a.getDate()} a ${b.getDate()} ${MES[b.getMonth()]} ${b.getFullYear()}`
    :`${a.getDate()} ${MES[a.getMonth()]} a ${b.getDate()} ${MES[b.getMonth()]} ${b.getFullYear()}`;
  if(per==="mes")return `${MESX[a.getMonth()]} de ${a.getFullYear()}`;
  return String(a.getFullYear());}
function diasEntre(a,b){const out=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))out.push(new Date(d));return out;}

/* ============ Cálculos (só volume) ============ */
const SEGS=["tot","pouch","sint","drive"];
const zero=()=>({tot:0,pouch:0,sint:0,drive:0});
function calcular(D,per,ref,uf){
  const [a,b]=intervalo(per,ref), ka=chave(a), kb=chave(b);
  const refAnt=new Date(a);refAnt.setDate(refAnt.getDate()-1);const [pa,pb]=intervalo(per,refAnt), kpa=chave(pa), kpb=chave(pb);
  const [ea,eb]=per==="dia"?intervalo("semana",ref):[a,b], kea=chave(ea), keb=chave(eb);
  const C=D._classe, tot=zero(), ant=zero(), porB=new Map(), porVend=new Map(), porCli=new Map(), ped=new Set(), cli=new Set(), pedPouch=new Set();
  const cob={pouch:[new Set(),new Set()],sint:[new Set(),new Set()],drive:[new Set(),new Set()]}; // [pedidos, clientes]
  const pedAnt=new Set(), pedPouchAnt=new Set();
  let semClassif=0;
  for(const [dt,vend,idCli,nped,cod,lit] of D.linhas){
    if(uf&&UF_DE.get(idCli)!==uf)continue;
    const c=C[cod];
    const add=o=>{o.tot+=lit;if(c){if(c.pouch)o.pouch+=lit;if(c.sint)o.sint+=lit;if(c.drive)o.drive+=lit;}};
    const temPouch=c&&c.pouch&&lit>0;
    if(dt>=ka&&dt<=kb){add(tot);ped.add(nped);cli.add(idCli);if(temPouch)pedPouch.add(nped);if(!c)semClassif+=lit;
      if(c&&lit>0)for(const k of ["pouch","sint","drive"])if(c[k]){cob[k][0].add(nped);cob[k][1].add(idCli);}
      let v=porVend.get(vend);if(!v){v={...zero(),ped:new Set(),pp:new Set()};porVend.set(vend,v);}add(v);v.ped.add(nped);if(temPouch)v.pp.add(nped);
      let k=porCli.get(idCli);if(!k){k={...zero(),ped:new Set(),vend:new Set()};porCli.set(idCli,k);}add(k);k.ped.add(nped);k.vend.add(vend);}
    else if(dt>=kpa&&dt<=kpb){add(ant);pedAnt.add(nped);if(temPouch)pedPouchAnt.add(nped);}
    if(dt>=kea&&dt<=keb){const k=per==="ano"?dt.slice(0,7):dt;let o=porB.get(k);if(!o){o=zero();porB.set(k,o);}add(o);}
  }
  let buckets;
  if(per==="ano")buckets=MES.map((m,i)=>({lb:m,atual:a.getFullYear()===HOJE.getFullYear()&&i===HOJE.getMonth(),
      ...(porB.get(`${a.getFullYear()}-${String(i+1).padStart(2,"0")}`)||zero())}));
  else buckets=diasEntre(ea,eb).map(d=>({lb:per==="mes"?String(d.getDate()):`${SEM[d.getDay()]} ${d.getDate()}`,
      dia:d.getDate(),atual:per==="dia"?mesmoDia(d,ref):mesmoDia(d,HOJE),...(porB.get(chave(d))||zero())}));
  const vend=[...porVend].map(([nome,o])=>({nome,...o})).sort((x,y)=>y.tot-x.tot);
  const clis=[...porCli].map(([id,o])=>({id,nome:D.clientes[id]||"Cliente "+id,uf:UF_DE.get(id)||"",...o})).sort((x,y)=>y.tot-x.tot);
  return {tot,ant,buckets,vend,clis,ped:ped.size,cli:cli.size,pedPouch:pedPouch.size,cob:Object.fromEntries(Object.entries(cob).map(([k,[p,c]])=>[k,{ped:p.size,cli:c.size}])),pedAnt:pedAnt.size,pedPouchAnt:pedPouchAnt.size,semClassif};
}

  rodape();
  if(D.semClassif) console.warn(`${D.semClassif} L sem classificação no período`);
}

function rodape(msgErro){
  $("rodape").className="abs atrasado";
  $("rodape").textContent=msgErro||"";
}
let tAviso;function avisar(t){const a=$("aviso");a.textContent=t;a.hidden=false;clearTimeout(tAviso);tAviso=setTimeout(()=>a.hidden=true,4500);}

/* ============ Carregar CSV (botão ou arrastar) ============ */
async function receberArquivos(files){
  let tot=0,dias=new Set();
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();
      let txt=new TextDecoder("utf-8").decode(buf);
      if(txt.includes("\uFFFD")) txt=new TextDecoder("windows-1252").decode(buf);
      const novas=csvParaLinhas(txt,DADOS); if(!novas.length) throw new Error("nenhuma venda com data válida");
      mesclar(DADOS,novas).forEach(d=>dias.add(d)); tot+=novas.length;
    }catch(e){avisar(`Não deu para ler "${f.name}": ${e.message}`);return;}
  }
  prepararDados(DADOS); salvarLocal(); irParaUltimo(); desenhar();
  avisar(`${nf(tot)} itens de venda carregados · ${dias.size} ${dias.size===1?"dia":"dias"} atualizados`);
}
$("btnCsv").addEventListener("click",()=>$("arquivo").click());
$("arquivo").addEventListener("change",e=>{if(e.target.files.length)receberArquivos([...e.target.files]);e.target.value="";});
let arrastando=0;
addEventListener("dragenter",e=>{if(ONLINE||![...e.dataTransfer.types].includes("Files"))return;e.preventDefault();arrastando++;$("soltar").hidden=false;});
addEventListener("dragover",e=>{if([...e.dataTransfer.types].includes("Files"))e.preventDefault();});
addEventListener("dragleave",()=>{if(--arrastando<=0){arrastando=0;$("soltar").hidden=true;}});
addEventListener("drop",e=>{e.preventDefault();if(ONLINE)return;arrastando=0;$("soltar").hidden=true;if(e.dataTransfer.files.length)receberArquivos([...e.dataTransfer.files]);});

/* ============ Busca automática (opcional, CONFIG.DATA_URL) ============ */
let versao="";
async function buscarRemoto(){
  if(!ONLINE)return;
  try{
    const r=await fetch(CONFIG.DATA_URL+(CONFIG.DATA_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const buf=await r.arrayBuffer();
    let txt=new TextDecoder("utf-8").decode(buf);
    if(txt.includes("\uFFFD")) txt=new TextDecoder("windows-1252").decode(buf);
    if(txt===versao){rodape();return;} versao=txt;
    const ultAntes=DADOS?._ultimo||"";
    const novo={gerado_em:new Date().toISOString(),produtos:{},clientes:{},linhas:[]};
    novo.linhas=csvParaLinhas(txt,novo);                 // o arquivo do repositório é a fonte completa
    DADOS=novo; prepararDados(DADOS);
    if(DADOS._ultimo>ultAntes) irParaUltimo();          // chegou dia novo: o painel pula para ele
    desenhar();
  }catch(e){rodape("Não foi possível ler os dados ("+e.message+"). Nova tentativa em "+CONFIG.BUSCA_MIN+" min");}
}

/* ============ Calendário ============ */
const cal=$("cal"); let vista=new Date();
function abrirCal(){vista=new Date(estado.ref);vista.setDate(1);desenharCal();cal.hidden=false;$("rotulo").setAttribute("aria-expanded","true");
  cal.querySelector("button.sel,.cal-dias button:not(:disabled)")?.focus();}
function fecharCal(){cal.hidden=true;$("rotulo").setAttribute("aria-expanded","false");}
function escolher(d){estado.ref=d>HOJE?new Date(HOJE):d;fecharCal();desenhar();$("rotulo").focus();}

function desenharCal(){
  const per=estado.per, ref=estado.ref, dias=DADOS?._dias||new Set();
  if(per==="dia"||per==="semana"){
    const y=vista.getFullYear(),m=vista.getMonth(),ini=inicioSemana(new Date(y,m,1)),fim=new Date(y,m+1,0);
    const semRef=chave(inicioSemana(ref));
    let linhas="";
    for(let s=new Date(ini);s<=fim;s.setDate(s.getDate()+7)){
      const selSem=per==="semana"&&chave(s)===semRef;
      linhas+=`<tr class="${selSem?"sel":""}">`+Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);
        const futuro=per==="dia"?d>HOJE:s>HOJE, sel=per==="dia"&&mesmoDia(d,ref);
        return `<td><button data-d="${chave(d)}" class="${d.getMonth()!==m?"fora":""}${sel?" sel":""}${mesmoDia(d,HOJE)?" hoje":""}${dias.has(chave(d))?" tem":""}"
          ${futuro?"disabled":""} aria-label="${d.getDate()} de ${MESX[d.getMonth()]}">${d.getDate()}</button></td>`;}).join("")+"</tr>";}
    const proxOk=new Date(y,m+1,1)<=HOJE;
    cal.innerHTML=`<div class="cal-top"><button data-nav="-1" aria-label="Mês anterior">‹</button><b>${MESX[m]} de ${y}</b>
      <button data-nav="1" aria-label="Próximo mês" ${proxOk?"":"disabled"}>›</button></div>
      <table class="cal-dias ${per==="semana"?"modo-semana":""}"><thead><tr>${["S","T","Q","Q","S","S","D"].map(x=>`<th>${x}</th>`).join("")}</tr></thead>
      <tbody>${linhas}</tbody></table>
      <p class="cal-dica">${per==="semana"?"Clique em qualquer dia para escolher a semana inteira (segunda a domingo)":"Escolha o dia · o pontinho marca dias com pedidos"}</p>`;
  } else if(per==="mes"){
    const y=vista.getFullYear();
    cal.innerHTML=`<div class="cal-top"><button data-nav="-12" aria-label="Ano anterior">‹</button><b>${y}</b>
      <button data-nav="12" aria-label="Próximo ano" ${y<HOJE.getFullYear()?"":"disabled"}>›</button></div>
      <div class="cal-grade">${MESX.map((n,i)=>{const d=new Date(y,i,1);
        return `<button data-d="${chave(d)}" ${d>HOJE?"disabled":""} class="${y===ref.getFullYear()&&i===ref.getMonth()?"sel":""}">${n[0].toUpperCase()+n.slice(1,3)}</button>`;}).join("")}</div>`;
  } else {
    const anos=Array.from({length:6},(_,i)=>HOJE.getFullYear()-5+i);
    cal.innerHTML=`<div class="cal-top"><b>Escolha o ano</b></div><div class="cal-grade">${anos.map(a=>
      `<button data-d="${a}-01-01" class="${a===ref.getFullYear()?"sel":""}">${a}</button>`).join("")}</div>`;
  }
}
cal.addEventListener("click",e=>{
  e.stopPropagation();
  const n=e.target.closest("button[data-nav]");if(n){vista.setMonth(vista.getMonth()+ +n.dataset.nav);desenharCal();return;}
  const b=e.target.closest("button[data-d]");if(!b||b.disabled)return;
  let dt=deChave(b.dataset.d);
  if(estado.per==="mes"&&dt.getFullYear()===HOJE.getFullYear()&&dt.getMonth()===HOJE.getMonth())dt=new Date(HOJE);
  if(estado.per==="ano"&&dt.getFullYear()===HOJE.getFullYear())dt=new Date(HOJE);
  escolher(dt);
});
$("rotulo").addEventListener("click",e=>{e.stopPropagation();cal.hidden?abrirCal():fecharCal();});
document.addEventListener("click",e=>{if(!cal.hidden&&!cal.contains(e.target))fecharCal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!cal.hidden){fecharCal();$("rotulo").focus();}});

/* ============ Filtros ============ */
$("fPeriodo").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;estado.per=b.dataset.v;fecharCal();desenhar();});
$("fUF").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;estado.uf=b.dataset.v;desenhar();});
/* Ordenar rankings: 1º clique = maior primeiro, 2º clique = menor primeiro */
for(const [tab,ch] of [["vendedores","ordV"],["clientes","ordC"]])
  $(tab).querySelector("thead").addEventListener("click",e=>{const th=e.target.closest("th.ord");if(!th)return;
    const o=estado[ch];o.dir=o.k===th.dataset.ord?-o.dir:-1;o.k=th.dataset.ord;desenhar();
    $(tab).querySelector(".rolagem").scrollTop=0;});
$("ant").addEventListener("click",()=>{estado.ref=mover(estado.per,estado.ref,-1);desenhar();});
$("prox").addEventListener("click",()=>{estado.ref=mover(estado.per,estado.ref,1);desenhar();});

/* ============ Início ============ */
if(ONLINE){$("btnCsv").hidden=true;$("aviso").textContent="";}
DADOS=lerLocal()||structuredClone(EMBUTIDO);
prepararDados(DADOS); irParaUltimo(); desenhar();
if(ONLINE)rodape("Carregando dados…");
buscarRemoto(); setInterval(()=>{HOJE=new Date();HOJE.setHours(0,0,0,0);buscarRemoto();},CONFIG.BUSCA_MIN*60000);
</script>
