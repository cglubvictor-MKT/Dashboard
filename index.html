.abs{position:absolute}

/* Cabeçalho */
#titulo{left:476px;top:120px}
#titulo h1{margin:0;font-size:34px;font-weight:700;font-variation-settings:"wdth" 118;line-height:1.05;letter-spacing:.01em}
#titulo p{margin:4px 0 0;font-size:17px;color:var(--suave)}
#filtros{right:120px;top:112px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.grupo{display:flex;gap:10px;align-items:center}
.seg{display:flex;background:var(--painel-forte);border:1px solid rgba(182,222,1,.45);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 16px;border-radius:999px;font-size:16px;font-weight:600;color:var(--suave)}
.seg button[aria-pressed="true"]{background:var(--lima);color:#0B3A12}
.seg button:not([aria-pressed="true"]):hover{color:var(--texto)}
.nav{display:flex;align-items:center;background:var(--painel-forte);border:1px solid rgba(182,222,1,.45);border-radius:999px}
.nav button{all:unset;cursor:pointer;width:38px;height:36px;display:grid;place-items:center;font-size:20px;color:var(--lima)}
.nav button:disabled{color:var(--apagado);cursor:default}
button:focus-visible{outline:3px solid var(--lima);outline-offset:2px}

/* Indicadores */
#kpis{left:120px;top:214px;width:1680px;height:142px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.kpi{background:var(--painel);border:1px solid rgba(182,222,1,.35);border-radius:14px;padding:16px 22px;
  display:flex;flex-direction:column;justify-content:space-between;backdrop-filter:blur(2px)}
.kpi h3{margin:0;font-size:17px;font-weight:500;color:var(--suave)}
.kpi .v{font-size:46px;font-weight:700;font-variation-settings:"wdth" 88;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:22px;font-weight:600;margin-left:4px;color:var(--suave)}
.kpi .d{font-size:15px;color:var(--suave)}
.kpi .d b{font-weight:700}
.sobe{color:var(--sobe)} .desce{color:var(--desce)}
.kpi.destaque{background:var(--lima);border-color:var(--lima);color:#0B3A12}
.kpi.destaque h3,.kpi.destaque .d,.kpi.destaque .v small{color:#1F5A12}
.medidor{height:8px;border-radius:4px;background:rgba(11,58,18,.2);overflow:hidden}
.medidor i{display:block;height:100%;background:#0B3A12;border-radius:4px;transition:width .7s ease}

/* Painéis */
.painel{overflow:hidden;background:var(--painel);border-top:2px solid var(--linha);border-radius:0 0 14px 14px;padding:18px 24px}
.painel h2{margin:0;font-size:21px;font-weight:600;font-variation-settings:"wdth" 110}
.painel .nota{font-size:14px;color:var(--suave);margin:2px 0 0}
#evolucao{left:120px;top:378px;width:1060px;height:262px}
#equipes{left:120px;top:658px;width:1060px;height:282px;
  clip-path:polygon(0 0,100% 0,100% 100%,157px 100%,0 125px)}
#vendedores{left:1200px;top:378px;width:600px;height:376px}
#clientes{left:1200px;top:772px;width:600px;height:168px}

/* Gráfico de evolução */
.grafico{position:absolute;left:24px;right:24px;bottom:16px;top:74px;display:flex;align-items:flex-end;gap:6px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
#equipes .col{justify-content:flex-start}
.barra{width:100%;max-width:64px;background:var(--fita-apagada);border-radius:4px 4px 0 0;transition:height .6s ease;min-height:2px}
.col.atual .barra{background:var(--fita)}
.col .lb{font-size:13px;color:var(--suave);margin-top:6px;height:18px;white-space:nowrap}
.col.atual .lb{color:var(--lima);font-weight:700}
.col .vl{font-size:13px;font-weight:600;margin-bottom:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.meta-linha{position:absolute;left:0;right:0;border-top:2px dashed rgba(242,252,0,.7);pointer-events:none;transition:bottom .6s ease}
.meta-linha span{position:absolute;right:0;top:-22px;font-size:13px;color:var(--lima);background:var(--painel-forte);padding:0 6px;border-radius:4px}

/* Equipes */
#equipes .grafico{left:190px;top:56px;bottom:10px;gap:22px}
#equipes .area{position:relative;width:100%;max-width:92px;height:118px}
#equipes .barra{position:absolute;bottom:0;left:0;right:0;max-width:none}
#equipes .col .pc{font-size:22px;font-weight:700;font-variation-settings:"wdth" 85;margin-bottom:2px}
#equipes .col .vl{color:var(--suave);font-weight:500}
#equipes .col .lb{font-size:14px;color:var(--texto);text-align:center;white-space:normal;line-height:1.1;height:32px;display:flex;align-items:center}
#equipes .col .vl{margin:0}
.alvo{position:absolute;left:-6px;right:-6px;border-top:2px solid var(--lima);pointer-events:none;transition:bottom .6s ease}
#legenda{position:absolute;left:24px;top:64px;width:150px;font-size:13px;color:var(--suave);line-height:1.35}
#legenda span{display:inline-block;width:18px;vertical-align:middle;margin-right:6px}

/* Tabelas */
table{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
th{font-size:13px;font-weight:500;color:var(--suave);text-align:left;padding:0 6px 6px}
td{font-size:15px;padding:4px 6px;height:29px;border-top:1px solid rgba(182,222,1,.15);white-space:nowrap}
td.n{color:var(--suave);width:28px;text-align:right}
td.num,th.num{text-align:right}
td.nm{max-width:190px;overflow:hidden;text-overflow:ellipsis}
td.eq,td.id{font-size:13px;color:var(--suave);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.mini{display:inline-block;width:70px;height:8px;background:rgba(182,222,1,.18);border-radius:4px;vertical-align:middle;margin-right:8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--fita)}
tr.bateu td.pc{color:var(--lima);font-weight:700}
#clientes table{margin-top:6px}

/* Rodapé no recorte inferior da moldura */
#rodape{left:540px;top:980px;width:480px;text-align:center;font-size:15px;font-weight:600;color:#0B3A12}

/* Calendário */
#rotulo{all:unset;cursor:pointer;min-width:230px;text-align:center;font-size:17px;font-weight:600;padding:6px 4px;border-radius:8px}
#rotulo:hover{color:var(--lima)}
#rotulo::after{content:"";display:inline-block;margin-left:8px;border:5px solid transparent;border-top-color:currentColor;transform:translateY(3px)}
#cal{right:120px;top:162px;width:372px;z-index:10;background:#05301B;border:1px solid var(--linha);border-radius:14px;padding:14px 14px 12px;
  box-shadow:0 18px 44px rgba(0,0,0,.5)}
#cal[hidden]{display:none}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-top b{font-size:17px;font-weight:600}
.cal-top button{all:unset;cursor:pointer;width:34px;height:32px;display:grid;place-items:center;font-size:20px;color:var(--lima);border-radius:8px}
.cal-top button:disabled{color:var(--apagado);cursor:default}
.cal-dias{width:100%;border-collapse:separate;border-spacing:0 3px;margin:0}
.cal-dias th{font-size:13px;color:var(--suave);text-align:center;padding:0 0 4px;font-weight:500}
.cal-dias td{padding:0;border:0;height:auto;text-align:center}
.cal-dias button,.cal-grade button{all:unset;cursor:pointer;display:block;width:100%;height:36px;line-height:36px;text-align:center;
  font-size:16px;border-radius:8px;font-variant-numeric:tabular-nums}
.cal-dias button.fora{color:var(--apagado)}
.cal-dias button:disabled,.cal-grade button:disabled{color:#2F5A3E;cursor:default}
.cal-dias button:not(:disabled):hover,.cal-grade button:not(:disabled):hover{background:rgba(242,252,0,.14)}
.cal-dias button.sel,.cal-grade button.sel{background:var(--lima);color:#0B3A12;font-weight:700}
.cal-dias button.hoje:not(.sel){box-shadow:inset 0 0 0 1px var(--linha)}
/* semana: a linha inteira acende */
.modo-semana tr:hover button:not(:disabled){background:rgba(242,252,0,.14);border-radius:0}
.modo-semana tr button{border-radius:0}
.modo-semana tr td:first-child button{border-radius:8px 0 0 8px}
.modo-semana tr td:last-child button{border-radius:0 8px 8px 0}
.modo-semana tr.sel button{background:var(--lima);color:#0B3A12;font-weight:700}
.modo-semana tr.sel button.fora{color:#2F6A1E}
.cal-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cal-grade button{height:48px;line-height:48px}
.cal-dica{margin:8px 2px 0;font-size:13px;color:var(--suave)}
#rodape.atrasado{color:#8A1C0A}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="palco">
  <div class="abs" id="titulo">
    <h1>Painel de faturamento</h1>
    <p>CGLub · Bahia e Sergipe</p>
  </div>

  <div class="abs" id="filtros">
    <div class="grupo">
      <div class="seg" id="fPeriodo" role="group" aria-label="Período">
        <button data-v="dia">Dia</button><button data-v="semana">Semana</button>
        <button data-v="mes">Mês</button><button data-v="ano">Ano</button>
      </div>
      <div class="nav">
        <button id="ant" aria-label="Período anterior">‹</button>
        <button id="rotulo" aria-haspopup="dialog" aria-expanded="false"></button>
        <button id="prox" aria-label="Próximo período">›</button>
      </div>
    </div>
    <div class="grupo">
      <div class="seg" id="fCanal" role="group" aria-label="Canal">
        <button data-v="">Todos os canais</button><button data-v="Postos">Postos</button>
        <button data-v="Extra Rede">Extra Rede</button><button data-v="B2B">B2B</button>
      </div>
      <div class="seg" id="fUF" role="group" aria-label="Estado">
        <button data-v="">BA e SE</button><button data-v="BA">BA</button><button data-v="SE">SE</button>
      </div>
    </div>
  </div>

  <div class="abs" id="cal" role="dialog" aria-label="Escolher período" hidden></div>
  <div class="abs" id="kpis"></div>

  <section class="abs painel" id="evolucao">
    <h2 id="evoTit">Faturamento por dia</h2>
    <p class="nota" id="evoNota"></p>
    <div class="grafico" id="evoGraf"></div>
  </section>

  <section class="abs painel" id="equipes">
    <h2>Atingimento por equipe</h2>
    <div id="legenda"><span style="height:10px;background:var(--fita)"></span>Faturado<br>
      <span style="border-top:2px solid var(--lima)"></span>Meta do período</div>
    <div class="grafico" id="eqGraf"></div>
  </section>

  <section class="abs painel" id="vendedores">
    <h2>Ranking de vendedores</h2>
    <table><thead><tr><th></th><th>Vendedor</th><th>Equipe</th><th class="num">Faturado</th><th>Meta</th></tr></thead>
      <tbody id="tbVend"></tbody></table>
  </section>

  <section class="abs painel" id="clientes">
    <h2>Maiores clientes</h2>
    <table><tbody id="tbCli"></tbody></table>
  </section>

  <div class="abs" id="rodape"></div>
</div>

<script>
/* ===================== CONFIGURAÇÃO ===================== */
const CONFIG = {
  // Endereço público do dados.json gerado pelo coletor do SAP. Vazio = dados de exemplo.
  DATA_URL: "",
  BUSCA_MIN: 2,      // a página procura dados novos a cada X minutos
  ATRASO_MIN: 25     // acima disso o rodapé avisa que o coletor parou
};

/* O endereço dos dados também pode vir no próprio link do painel, sem ficar gravado no GitHub:
   https://SEU_USUARIO.github.io/painel-faturamento/#d=SEU_USUARIO/ID_DO_GIST            */
(()=>{const m=location.hash.match(/[#&]d=([^&]+)/);if(!m)return;const v=decodeURIComponent(m[1]);
  CONFIG.DATA_URL=/^https?:/.test(v)?v:`https://gist.githubusercontent.com/${v}/raw/dados.json`;})();

/* ============ Palco: escala para qualquer tela ============ */
const palco=document.getElementById("palco");
function encaixar(){const s=Math.min(innerWidth/1920,innerHeight/1080);palco.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener("resize",encaixar);encaixar();

/* ============ Utilidades ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=(v,d=0)=>v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const brl=v=>"R$ "+nf(v);
function brlCurto(v){ if(v>=1e6) return ["R$ "+nf(v/1e6,2),"mi"]; if(v>=1e3) return ["R$ "+nf(v/1e3,0),"mil"]; return ["R$ "+nf(v),""]; }
function volCurto(v){ if(v>=1e6) return [nf(v/1e6,2),"mi L"]; if(v>=1e3) return [nf(v/1e3,1),"mil L"]; return [nf(v),"L"]; }
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESX=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const SEM=["dom","seg","ter","qua","qui","sex","sáb"];
const chave=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const mesmoDia=(a,b)=>chave(a)===chave(b);
let HOJE=new Date(); HOJE.setHours(0,0,0,0);

/* ============ Formato do arquivo de dados (o coletor do SAP gera igual) ============
{
  "gerado_em": "2026-09-25T14:10:00-03:00",
  "equipes":    [{"id":"PBA","nome":"Postos BA"}],
  "vendedores": [{"id":"50000079","nome":"...","equipe":"PBA","canal":"Postos","uf":"BA","meta_mes":250000}],
  "clientes":   {"1000123":"AUTO POSTO X"},
  "linhas":     [["2026-09-25","50000079","1000123", valor_liquido, litros, notas]]   // 1 linha por dia × vendedor × cliente
}
==================================================================================== */

/* ============ DADOS DE EXEMPLO ============ */
function rng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function gerarDemo(){
  const equipes=[{id:"PBA",nome:"Postos BA",canal:"Postos",uf:"BA"},{id:"PSE",nome:"Postos SE",canal:"Postos",uf:"SE"},
    {id:"ERS",nome:"Extra Rede Salvador",canal:"Extra Rede",uf:"BA"},{id:"ERI",nome:"Extra Rede Interior",canal:"Extra Rede",uf:"BA"},
    {id:"ESE",nome:"Extra Rede SE",canal:"Extra Rede",uf:"SE"},{id:"B2B",nome:"B2B",canal:"B2B",uf:"BA"}];
  const nomes=["Aline Moura","Bruno Teles","Caio Freitas","Débora Luz","Edson Pires","Fernanda Rios","Gustavo Melo","Helena Braga",
    "Igor Santana","Júlia Neves","Kleber Assis","Larissa Pinho","Márcio Dantas","Nádia Costa","Otávio Reis","Paula Viana",
    "Renato Sales","Sabrina Lago","Tomás Barreto","Vitória Cunha"];
  const mapa=["PBA","PBA","PBA","PBA","PSE","PSE","ERS","ERS","ERS","ERS","ERI","ERI","ERI","ERI","ESE","ESE","B2B","B2B","B2B","ERI"];
  const tipos=["Auto Posto","Comercial","Lubrificantes","Transportadora","Autopeças","Mecânica","Distribuidora","Agropecuária"];
  const partes=["São Jorge","Recôncavo","Litoral","Sertão","Paraguaçu","Atlântico","Sete Lagoas","Bom Jesus","Chapada","Rio Real","Itapuã","Serrana"];
  const clientes={},linhas=[];
  const vendedores=nomes.map((n,i)=>{const r=rng("v"+i),eq=equipes.find(e=>e.id===mapa[i]);
    return {id:String(50000100+i),nome:n,equipe:eq.id,canal:eq.canal,uf:eq.uf,meta_mes:Math.round(180+r()*260)*1000};});
  vendedores.forEach((v,i)=>{const r=rng("c"+i);v._cli=[];
    for(let k=0;k<40;k++){const id=String(1000100+i*40+k);clientes[id]=`${tipos[Math.floor(r()*tipos.length)]} ${partes[Math.floor(r()*partes.length)]}`;v._cli.push(id);}});
  for(let d=new Date(HOJE.getFullYear()-1,0,1);d<=HOJE;d.setDate(d.getDate()+1)){
    const dw=d.getDay(),k=chave(d);
    for(const v of vendedores){const r=rng(v.id+k);
      const n=dw===0?0:dw===6?(r()<.3?1:0):1+Math.floor(r()*5);if(!n)continue;
      let alvo=v.meta_mes/22*(0.35+r()*1.4)*(dw===6?.4:1);
      for(let j=0;j<n;j++){const val=j===n-1?alvo:alvo*(0.2+r()*0.5);alvo-=val;
        linhas.push([k,v.id,v._cli[Math.floor(r()*40)],Math.round(val*100)/100,Math.round(val/(19+r()*5)),1]);}}
  }
  vendedores.forEach(v=>delete v._cli);
  return {gerado_em:new Date().toISOString(),demo:true,equipes,vendedores,clientes,linhas};
}

/* ============ Períodos ============ */
function inicioSemana(d){const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x;}
function intervalo(per,ref){
  const a=new Date(ref);
  if(per==="dia")return [a,new Date(a)];
  if(per==="semana"){const s=inicioSemana(a),b=new Date(s);b.setDate(s.getDate()+6);return [s,b];}
  if(per==="mes")return [new Date(a.getFullYear(),a.getMonth(),1),new Date(a.getFullYear(),a.getMonth()+1,0)];
  return [new Date(a.getFullYear(),0,1),new Date(a.getFullYear(),11,31)];
}
function mover(per,ref,n){const d=new Date(ref);
  if(per==="dia")d.setDate(d.getDate()+n);else if(per==="semana")d.setDate(d.getDate()+7*n);
  else if(per==="mes"){d.setDate(1);d.setMonth(d.getMonth()+n);}else{d.setMonth(0,1);d.setFullYear(d.getFullYear()+n);}
  return d>HOJE?new Date(HOJE):d;}
function rotulo(per,ref){const [a,b]=intervalo(per,ref);
  if(per==="dia")return `${SEM[a.getDay()]}, ${a.getDate()} ${MES[a.getMonth()]} ${a.getFullYear()}`;
  if(per==="semana")return a.getMonth()===b.getMonth()?`${a.getDate()} a ${b.getDate()} ${MES[b.getMonth()]} ${b.getFullYear()}`
    :`${a.getDate()} ${MES[a.getMonth()]} a ${b.getDate()} ${MES[b.getMonth()]} ${b.getFullYear()}`;
  if(per==="mes")return `${MESX[a.getMonth()]} de ${a.getFullYear()}`;
  return String(a.getFullYear());}
function diasEntre(a,b){const out=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))out.push(new Date(d));return out;}
const metaPeriodo=(m,per)=>per==="dia"?m/22:per==="semana"?m/4.4:per==="mes"?m:m*12;

/* ============ Cálculos sobre o arquivo de dados ============ */
function calcular(D,per,ref,canal,uf){
  const vs=D.vendedores.filter(v=>(!canal||v.canal===canal)&&(!uf||v.uf===uf)), vset=new Set(vs.map(v=>v.id));
  const [a,b]=intervalo(per,ref), ka=chave(a), kb=chave(b);
  const refAnt=new Date(a);refAnt.setDate(refAnt.getDate()-1);const [pa,pb]=intervalo(per,refAnt), kpa=chave(pa), kpb=chave(pb);
  const [ea,eb]=per==="dia"?intervalo("semana",ref):per==="ano"?[a,b]:[a,b], kea=chave(ea), keb=chave(eb);
  const porVend=new Map(), porCli=new Map(), porDia=new Map();
  let fat=0,vol=0,notas=0,fatAnt=0,volAnt=0,notasAnt=0;
  for(const [dt,v,c,val,lit,n] of D.linhas){
    if(!vset.has(v))continue;
    if(dt>=ka&&dt<=kb){fat+=val;vol+=lit;notas+=n;
      const pv=porVend.get(v)||{fat:0};pv.fat+=val;porVend.set(v,pv);
      porCli.set(c,(porCli.get(c)||0)+val);}
    else if(dt>=kpa&&dt<=kpb){fatAnt+=val;volAnt+=lit;notasAnt+=n;}
    if(dt>=kea&&dt<=keb){const k=per==="ano"?dt.slice(0,7):dt;porDia.set(k,(porDia.get(k)||0)+val);}
  }
  const metaMesTot=vs.reduce((s,v)=>s+v.meta_mes,0);
  const linhas=vs.map(v=>({...v,fat:porVend.get(v.id)?.fat||0,meta:metaPeriodo(v.meta_mes,per)}));
  let buckets;
  if(per==="ano")buckets=MES.map((m,i)=>({lb:m,atual:a.getFullYear()===HOJE.getFullYear()&&i===HOJE.getMonth(),
      v:porDia.get(`${a.getFullYear()}-${String(i+1).padStart(2,"0")}`)||0,meta:metaMesTot}));
  else buckets=diasEntre(ea,eb).map(d=>({lb:per==="mes"?String(d.getDate()):`${SEM[d.getDay()]} ${d.getDate()}`,
      atual:per==="dia"?mesmoDia(d,ref):mesmoDia(d,HOJE),fds:d.getDay()===0||d.getDay()===6,
      v:porDia.get(chave(d))||0,meta:metaMesTot/22}));
  const eqs=D.equipes.filter(e=>linhas.some(l=>l.equipe===e.id)).map(e=>{const ls=linhas.filter(l=>l.equipe===e.id);
    return {nome:e.nome,fat:ls.reduce((s,l)=>s+l.fat,0),meta:ls.reduce((s,l)=>s+l.meta,0)};});
  const clientes=[...porCli].sort((x,y)=>y[1]-x[1]).slice(0,4).map(([id,v])=>({id,nome:D.clientes[id]||"Cliente "+id,v}));
  return {linhas,fat,vol,notas,fatAnt,volAnt,notasAnt,meta:linhas.reduce((s,l)=>s+l.meta,0),
    clientesPos:porCli.size,buckets,eqs,clientes};
}

/* ============ Estado ============ */
const estado={per:"mes",ref:new Date(HOJE),canal:"",uf:""};
let DADOS=null;

function delta(atual,ant){if(!ant)return '<span>sem base de comparação</span>';const p=(atual/ant-1)*100;
  return `<b class="${p>=0?"sobe":"desce"}">${p>=0?"▲":"▼"} ${nf(Math.abs(p),1)}%</b> vs período anterior`;}

function desenhar(){
  if(!DADOS)return;
  const {per,ref,canal,uf}=estado, D=calcular(DADOS,per,ref,canal,uf);
  for(const [id,k] of [["fPeriodo","per"],["fCanal","canal"],["fUF","uf"]])
    $(id).querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===estado[k]));
  $("rotulo").textContent=rotulo(per,ref);
  $("prox").disabled=intervalo(per,ref)[1]>=HOJE;

  const [f1,f2]=brlCurto(D.fat),[v1,v2]=volCurto(D.vol),pct=D.meta?D.fat/D.meta*100:0;
  const ticket=D.notas?D.fat/D.notas:0,ticketAnt=D.notasAnt?D.fatAnt/D.notasAnt:0;
  const [m1,m2]=brlCurto(D.meta);
  $("kpis").innerHTML=`
   <div class="kpi"><h3>Faturamento líquido</h3><div class="v">${f1}<small>${f2}</small></div><div class="d">${delta(D.fat,D.fatAnt)}</div></div>
   <div class="kpi"><h3>Volume faturado</h3><div class="v">${v1}<small>${v2}</small></div><div class="d">${delta(D.vol,D.volAnt)}</div></div>
   <div class="kpi destaque"><h3>Atingimento da meta</h3><div class="v">${D.meta?nf(pct,0)+"<small>%</small>":"—"}</div>
     <div class="medidor"><i style="width:${Math.min(100,pct)}%"></i></div><div class="d">${D.meta?`Meta de ${m1} ${m2}`:"Metas ainda não cadastradas"}</div></div>
   <div class="kpi"><h3>Clientes positivados</h3><div class="v">${nf(D.clientesPos)}</div><div class="d">${nf(D.notas)} notas faturadas</div></div>
   <div class="kpi"><h3>Ticket médio por nota</h3><div class="v">${brl(ticket)}</div><div class="d">${delta(ticket,ticketAnt)}</div></div>`;

  $("evoTit").textContent={dia:"Faturamento na semana",semana:"Faturamento por dia",mes:"Faturamento por dia",ano:"Faturamento por mês"}[per];
  $("evoNota").textContent=per==="dia"?"O dia escolhido aparece destacado":"A linha tracejada é a meta de cada "+(per==="ano"?"mês":"dia útil");
  const maxB=Math.max(...D.buckets.map(b=>Math.max(b.v,b.meta)),1), poucos=D.buckets.length<=12, altura=128;
  const uteis=D.buckets.filter(b=>!b.fds), metaMed=uteis.reduce((s,b)=>s+b.meta,0)/Math.max(1,uteis.length);
  $("evoGraf").innerHTML=D.buckets.map(b=>`<div class="col${b.atual?" atual":""}" title="${esc(b.lb)}: ${brl(b.v)}">
      ${poucos?`<div class="vl">${brlCurto(b.v).join(" ")}</div>`:""}
      <div class="barra" style="height:${b.v/maxB*altura}px"></div><div class="lb">${esc(b.lb)}</div></div>`).join("")+
    (metaMed?`<div class="meta-linha" style="bottom:${metaMed/maxB*altura+24}px"><span>Meta ${brlCurto(metaMed).join(" ")}</span></div>`:"");

  const maxE=Math.max(...D.eqs.map(e=>Math.max(e.fat,e.meta)),1), hE=118;
  $("eqGraf").innerHTML=D.eqs.map(e=>{const p=e.meta?e.fat/e.meta*100:null;
    return `<div class="col" title="${esc(e.nome)}: ${brl(e.fat)}${e.meta?" de "+brl(e.meta):""}">
      <div class="pc" style="color:${p>=100?"var(--lima)":"var(--texto)"}">${p==null?"—":nf(p,0)+"%"}</div>
      <div class="area"><div class="barra" style="height:${Math.max(0,e.fat)/maxE*hE}px;background:var(--fita)"></div>
        ${e.meta?`<div class="alvo" style="bottom:${e.meta/maxE*hE}px"></div>`:""}</div>
      <div class="lb">${esc(e.nome)}</div><div class="vl">${brlCurto(e.fat).join(" ")}</div></div>`;}).join("");

  const nomeEq=id=>DADOS.equipes.find(e=>e.id===id)?.nome||"";
  const rk=D.linhas.map(l=>({...l,p:l.meta?l.fat/l.meta*100:null})).sort((a,b)=>((b.p??-1)-(a.p??-1))||(b.fat-a.fat)).slice(0,10);
  $("tbVend").innerHTML=rk.map((l,i)=>`<tr class="${l.p>=100?"bateu":""}"><td class="n">${i+1}</td>
    <td class="nm">${esc(l.nome)}</td><td class="eq">${esc(nomeEq(l.equipe))}</td>
    <td class="num">${brl(l.fat)}</td><td class="pc">${l.p==null?"—":`<span class="mini"><i style="width:${Math.min(100,l.p)}%"></i></span>${nf(l.p,0)}%`}</td></tr>`).join("");

  $("tbCli").innerHTML=D.clientes.length?D.clientes.map((c,i)=>`<tr><td class="n">${i+1}</td>
    <td class="nm">${esc(c.nome)}</td><td class="id">ID ${esc(c.id)}</td><td class="num">${brl(c.v)}</td></tr>`).join("")
    :'<tr><td class="id">Nenhuma nota faturada neste período.</td></tr>';
  rodape();
}

function rodape(msgErro){
  const g=new Date(DADOS?.gerado_em||Date.now()), min=(Date.now()-g)/60000;
  const h=g.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const atras=!DADOS?.demo&&min>CONFIG.ATRASO_MIN;
  $("rodape").className="abs"+(atras||msgErro?" atrasado":"");
  $("rodape").textContent=msgErro||(DADOS?.demo?`Dados de exemplo · gerados às ${h}`
    :atras?`Dados de ${h} · sem atualização há ${Math.round(min)} min`:`Dados do SAP · atualizado às ${h}`);
}

/* ============ Busca automática dos dados ============ */
let versao="";
async function carregar(){
  HOJE=new Date();HOJE.setHours(0,0,0,0);
  if(!CONFIG.DATA_URL){ if(!DADOS){DADOS=gerarDemo();desenhar();} return; }
  try{
    const r=await fetch(CONFIG.DATA_URL+(CONFIG.DATA_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const novo=await r.json();
    if(novo.gerado_em!==versao){versao=novo.gerado_em;DADOS=novo;desenhar();} else rodape();
  }catch(e){ if(DADOS)rodape(); else rodape("Não foi possível ler os dados. Nova tentativa em "+CONFIG.BUSCA_MIN+" min"); }
}

/* ============ Calendário ============ */
const cal=$("cal"); let vista=new Date();
function abrirCal(){vista=new Date(estado.ref);vista.setDate(1);desenharCal();cal.hidden=false;$("rotulo").setAttribute("aria-expanded","true");
  cal.querySelector("button.sel,.cal-dias button:not(:disabled)")?.focus();}
function fecharCal(){cal.hidden=true;$("rotulo").setAttribute("aria-expanded","false");}
function escolher(d){estado.ref=d>HOJE?new Date(HOJE):d;fecharCal();desenhar();$("rotulo").focus();}

function desenharCal(){
  const per=estado.per, ref=estado.ref;
  if(per==="dia"||per==="semana"){
    const y=vista.getFullYear(),m=vista.getMonth(),ini=inicioSemana(new Date(y,m,1)),fim=new Date(y,m+1,0);
    const semRef=chave(inicioSemana(ref));
    let linhas="";
    for(let s=new Date(ini);s<=fim;s.setDate(s.getDate()+7)){
      const selSem=per==="semana"&&chave(s)===semRef;
      linhas+=`<tr class="${selSem?"sel":""}">`+Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);
        const futuro=per==="dia"?d>HOJE:s>HOJE, sel=per==="dia"&&mesmoDia(d,ref);
        return `<td><button data-d="${chave(d)}" class="${d.getMonth()!==m?"fora":""}${sel?" sel":""}${mesmoDia(d,HOJE)?" hoje":""}"
          ${futuro?"disabled":""} aria-label="${d.getDate()} de ${MESX[d.getMonth()]}">${d.getDate()}</button></td>`;}).join("")+"</tr>";}
    const proxOk=new Date(y,m+1,1)<=HOJE;
    cal.innerHTML=`<div class="cal-top"><button data-nav="-1" aria-label="Mês anterior">‹</button><b>${MESX[m]} de ${y}</b>
      <button data-nav="1" aria-label="Próximo mês" ${proxOk?"":"disabled"}>›</button></div>
      <table class="cal-dias ${per==="semana"?"modo-semana":""}"><thead><tr>${["S","T","Q","Q","S","S","D"].map(x=>`<th>${x}</th>`).join("")}</tr></thead>
      <tbody>${linhas}</tbody></table>
      <p class="cal-dica">${per==="semana"?"Clique em qualquer dia para escolher a semana inteira (segunda a domingo)":"Escolha o dia"}</p>`;
  } else if(per==="mes"){
    const y=vista.getFullYear();
    cal.innerHTML=`<div class="cal-top"><button data-nav="-12" aria-label="Ano anterior">‹</button><b>${y}</b>
      <button data-nav="12" aria-label="Próximo ano" ${y<HOJE.getFullYear()?"":"disabled"}>›</button></div>
      <div class="cal-grade">${MESX.map((n,i)=>{const d=new Date(y,i,1);
        return `<button data-d="${chave(d)}" ${d>HOJE?"disabled":""} class="${y===ref.getFullYear()&&i===ref.getMonth()?"sel":""}">${n[0].toUpperCase()+n.slice(1,3)}</button>`;}).join("")}</div>`;
  } else {
    const anos=Array.from({length:6},(_,i)=>HOJE.getFullYear()-5+i);
    cal.innerHTML=`<div class="cal-top"><b>Escolha o ano</b></div><div class="cal-grade">${anos.map(a=>
      `<button data-d="${a}-01-01" class="${a===ref.getFullYear()?"sel":""}">${a}</button>`).join("")}</div>`;
  }
}
cal.addEventListener("click",e=>{
  e.stopPropagation();
  const n=e.target.closest("button[data-nav]");if(n){vista.setMonth(vista.getMonth()+ +n.dataset.nav);desenharCal();return;}
  const b=e.target.closest("button[data-d]");if(!b||b.disabled)return;
  const [y,m,d]=b.dataset.d.split("-").map(Number);let dt=new Date(y,m-1,d);
  if(estado.per==="mes"&&y===HOJE.getFullYear()&&m-1===HOJE.getMonth())dt=new Date(HOJE);
  if(estado.per==="ano"&&y===HOJE.getFullYear())dt=new Date(HOJE);
  escolher(dt);
});
$("rotulo").addEventListener("click",e=>{e.stopPropagation();cal.hidden?abrirCal():fecharCal();});
document.addEventListener("click",e=>{if(!cal.hidden&&!cal.contains(e.target))fecharCal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!cal.hidden){fecharCal();$("rotulo").focus();}});

/* ============ Filtros ============ */
$("fPeriodo").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;estado.per=b.dataset.v;fecharCal();desenhar();});
$("fCanal").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;estado.canal=b.dataset.v;desenhar();});
$("fUF").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;estado.uf=b.dataset.v;desenhar();});
$("ant").addEventListener("click",()=>{estado.ref=mover(estado.per,estado.ref,-1);desenhar();});
$("prox").addEventListener("click",()=>{estado.ref=mover(estado.per,estado.ref,1);desenhar();});

carregar();
setInterval(carregar,CONFIG.BUSCA_MIN*60000);
</script>

</html>
